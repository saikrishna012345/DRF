<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lobster+Two:ital,wght@0,400;0,700;1,400;1,700&display=swap');
    </style>
</head>

<body>
    <div class="main">
        <div class="navbar">
            <ul>
                <h1 class="logo" style="flex-grow: 6;"><a href="index.html">TechGo</a></h1>
                <li style="flex-grow: 2;"><a href="index.html">HOME</a></li>
                <li style="flex-grow: 2;"><a href="about.html">ABOUT US</a></li>
                <li style="flex-grow: 2;"><a href="services.html">SERVICES</a></li>
                <li style="flex-grow: 2;"><a href="contactus.html">CONTACT US</a></li>
            </ul>
        </div>

        <div>
            <!-- Change or deletion of the name attributes in the input tag will lead to empty values on record submission-->
            <center>
                <table>
                    <form
                        action='https://forms.zohopublic.in/saikrishnam211911gm1/form/details/formperma/iCKeSaiqHLOnnEj1gvbzQHRa0DKbjPW04H6dj1LW0TQ/htmlRecords/submit'
                        name='form' id='form' method='POST' accept-charset='UTF-8' enctype='multipart/form-data'>
                        <input type="hidden" name="zf_referrer_name"
                            value=""><!-- To Track referrals , place the referrer name within the " " in the above hidden input field -->
                        <input type="hidden" name="zf_redirect_url"
                            value=""><!-- To redirect to a specific page after record submission , place the respective url within the " " in the above hidden input field -->
                        <input type="hidden" name="zc_gad"
                            value=""><!-- If GCLID is enabled in Zoho CRM Integration, click details of AdWords Ads will be pushed to Zoho CRM -->
                        <center>
                            <h2>Details</h2>
                        </center>
                        <p></p>

                        <tr>

                        <tr>
                            <td>
                                <label>First Name</label>
                            </td>
                            <td>
                                <input type="text" maxlength="255" name="Name_First" fieldType=7
                                    placeholder="Enter First Name" />
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label>Last Name</label>
                            </td>
                            <td>
                                <input type="text" maxlength="255" name="Name_Last" fieldType=7
                                    placeholder="Enter Last Name" />
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label>
                                    Email
                                </label>
                            </td>
                            <td>
                                <input type="text" maxlength="255" name="Email" value="" fieldType=9
                                    placeholder="Enter Email" />
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label>
                                    Phone
                                </label>
                            </td>
                            <td>
                                <input type="text" compname="PhoneNumber" name="PhoneNumber_countrycode" phoneFormat="1"
                                    isCountryCodeEnabled=false maxlength="20" value="" fieldType=11
                                    id="international_PhoneNumber_countrycode" placeholder="Number" />
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label>
                                    Gender
                                </label>
                            </td>
                            <td>
                                <input type="radio" id="Radio_1" name="Radio" value="Male" />
                                <label for="Radio_1">Male</label>
                                <input type="radio" id="Radio_2" name="Radio" value="Female" />
                                <label for="Radio_2">Female</label>
                                <input type="radio" id="Radio_3" name="Radio" value="Pefer not to say" />
                                <label for="Radio_3">Pefer not to say</label>
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label>
                                    linkedin url
                                </label>
                            </td>
                            <td>
                                <input type="text" maxlength="2083" name="Website" value=""
                                    placeholder="Enter linkedin url" />
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label>
                                    Upload your Resume
                                </label>
                            </td>
                            <td>
                                <input type="file" name="FileUpload" checktype="c1" />
                            </td>
                        </tr>

                        <tr>
                            <td>
                                <label>
                                    Self Introduction
                                </label>
                            </td>
                            <td>
                                <input type="file" accept="video/*" name="MediaUpload" checktype="c1" />
                            </td>
                        </tr>
                        <tr>
                            <td colspan="2">
                                <center>
                                    <button type="submit" class="button"><em>Submit</em></button>
                                </center>
                            </td>
                        </tr>
                    </form>

                </table>
            </center>
        </div>




        <div>
            <h3 style="display: flex;justify-content: center;">Location</h3>
            <div style="display: flex;justify-content: center;">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d121768.56627494215!2d78.35861200180382!3d17.49473014400839!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bcb9300472c8303%3A0x4321b9c6e05b642d!2sTech%20Jobs%20(Dr%20Reddy&#39;s%20Foundation)!5e0!3m2!1sen!2sin!4v1772535627392!5m2!1sen!2sin"
                    width="1200" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
        </div>



    </div>
    <footer>
        <p>© 2026 TechGo | All Rights Reserved</p>
    </footer>
</body>

</html>
